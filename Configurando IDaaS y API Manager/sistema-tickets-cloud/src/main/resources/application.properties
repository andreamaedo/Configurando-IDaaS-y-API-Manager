spring.application.name=sistema-tickets-cloud
server.port=8080

# --- AWS ---
# Se leen de variables de entorno (en EC2/Docker) o usan el valor por defecto.
aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:mi-bucket-tickets-duoc}

# --- Carpeta donde se genera el PDF del resumen (EFS en EC2, carpeta local en tu PC) ---
app.efs.base-path=${EFS_BASE_PATH:./temp-efs}

# --- Base de datos H2 en memoria ---
spring.datasource.url=jdbc:h2:mem:ticketsdb
spring.jpa.hibernate.ddl-auto=update
